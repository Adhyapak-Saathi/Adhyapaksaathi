<style>
  /* ================= NAVBAR & TOPBAR INTERNAL STYLES ================= */
  /*.topbar {
  }*/

  .topbar-inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .topbar-email {
    color: white;
    text-decoration: none;
  }

  /*#standardNav {
    Navbar styling yahan aayegi agar zaroorat ho 
  }*/

  .nav-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 15px;
    text-decoration: none;
  }

  .logo-box {
    width: 54px;
    height: 54px;
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 12px rgba(29, 52, 97, 0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .logo-svg {
    width: 44px;
    height: 44px;
  }

  .logo-text-wrapper {
    display: flex;
    flex-direction: column;
  }

  .logo-title {
    font-family: system-ui, sans-serif;
    font-size: clamp(1rem, 4vw, 1.35rem);
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .logo-strong {
    font-weight: 900;
  }

  .logo-saathi {
    font-weight: 300;
    color: #d4a017;
  }

  .logo-subtitle {
    font-size: clamp(0.55rem, 2vw, 0.65rem);
    color: #d4a017;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-weight: 600;
    margin-top: 2px;
    white-space: nowrap;
  }

  .nav-links {
    list-style: none;
    display: flex;
    gap: 20px;
  }

  .nav-links li a {
    text-decoration: none;
    color: #fff;
  }

  .nav-links li a.active {
    font-weight: bold;
    color: #d4a017;
  }

  .hamburger {
    display: none;
    cursor: pointer;
    flex-direction: column;
    gap: 4px;
  }

  .hamburger span {
    width: 25px;
    height: 3px;
    background: #fff;
    display: block;
  }
</style>

<!-- ================= TOP BAR ================= -->
<div class="topbar">
  <div class="topbar-inner">
    <span>📍 Serving Teacher Aspirants Across Gujarat & India</span>
    <div style="display: flex; align-items: center; gap: 20px;">
      <span>✉️ <a href="mailto:info@adhyapaksaathi.in" style="color: white; text-decoration: none;">info@adhyapaksaathi.in</a></span>
      
      <!-- Sirf Mocktest page par Lucide Login Icon dikhega -->
      {% if request.endpoint == 'mocktest' %}
      <div class="auth-dropdown">
        <button id="mainUserBtn" class="auth-dropbtn" title="Login">
          <i data-lucide="user"></i>
        </button>
        <div id="loginDropdownBox" class="auth-dropdown-content" style="right: 0; top: 110%;"></div>
      </div>
      {% endif %}
      
    </div>
  </div>
</div>


<!-- ================= NAVIGATION ================= -->
<nav id="standardNav">
  <div class="nav-inner">

    <a href="{{ url_for('home') }}" class="nav-logo">
      <div class="logo-box">
        <svg viewBox="0 0 160 160" class="logo-svg">
          <defs>
            <linearGradient id="nGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#0f172a" />
              <stop offset="100%" stop-color="#1d3461" />
            </linearGradient>
            <linearGradient id="gGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#d4a017" />
              <stop offset="100%" stop-color="#fbbf24" />
            </linearGradient>
          </defs>
          <g transform="translate(15, 20)">
            <path d="M 30 108 Q 80 115 125 102" fill="none" stroke="url(#gGrad)" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>
            <circle cx="48" cy="40" r="13" fill="url(#nGrad)"/>
            <path d="M 40 108 C 40 70 52 60 76 75" fill="none" stroke="url(#nGrad)" stroke-width="11" stroke-linecap="round"/>
            <circle cx="78" cy="55" r="9" fill="url(#gGrad)"/>
            <path d="M 64 108 C 64 90 70 82 76 75" fill="none" stroke="url(#gGrad)" stroke-width="8" stroke-linecap="round"/>
            <path d="M 70 82 Q 85 70 98 55" fill="none" stroke="url(#gGrad)" stroke-width="7" stroke-linecap="round"/>
            <path d="M 106 20 L 109 35 L 124 38 L 109 41 L 106 56 L 103 41 L 88 38 L 103 35 Z" fill="url(#gGrad)"/>
          </g>
        </svg>
      </div>
      <div class="logo-text-wrapper">
        <span class="logo-title">
          <strong class="logo-strong">ADHYAPAK</strong> 
          <span class="logo-saathi">SAATHI</span>
        </span>
        <span class="logo-subtitle">Teacher Exam Portal</span>
      </div>
    </a>

    <!-- Smart Links -->
    <ul class="nav-links" id="navLinks">
      <li>
        <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}">
          Home
        </a>
      </li>

      <li>
        <a href="{{ url_for('test') }}" class="{% if request.endpoint == 'test' %}active{% endif %}">
          Practice Test
        </a>
      </li>

      <li>
        <a href="{{ url_for('mocktest') }}" class="{% if request.endpoint == 'mocktest' %}active{% endif %}">
          Mock Test
        </a>
      </li>

      <li>
        <a href="{{ url_for('news') }}" class="{% if request.endpoint == 'news' %}active{% endif %}">
          Exam News
        </a>
      </li>

      <li>
        <a href="{{ url_for('materials') }}" class="{% if request.endpoint == 'materials' %}active{% endif %}">
          Study Materials
        </a>
      </li>

      <li>
        <a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}active{% endif %}">
          About Us
        </a>
      </li>

      <li>
        <a href="{{ url_for('contact') }}" class="{% if request.endpoint == 'contact' %}active{% endif %}">
          Contact
        </a>
      </li>

      <li>
        <a href="https://blog.adhyapaksaathi.in" target="_blank">
          Blog
        </a>
      </li>

    </ul>

    <div class="hamburger" onclick="toggleNav()">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </div>
</nav>
