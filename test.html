<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mock Test - Adhyapak Saathi</title>
    <style>
        /* Mobile First, Fixed Viewport Layout */
        body, html {
            margin: 0;
            padding: 0;
            height: 100vh; /* Exactly fit the screen */
            width: 100vw;
            overflow: hidden; /* Prevent full page scrolling */
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f7fb;
            color: #1d3461;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* 1. Header (Timer & Info) - Fixed at top */
        header {
            flex-shrink: 0;
            background: linear-gradient(135deg, #1d3461, #2b4c8a);
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            background: #d4a017;
            padding: 5px 15px;
            border-radius: 20px;
            color: #1d3461;
        }

        /* 2. Main Question Area - Scrollable ONLY if content is large */
        main {
            flex-grow: 1;
            overflow-y: auto; /* Scrollable inside */
            padding: 20px 15px;
            background: white;
        }

        .question-box {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            color: #334155;
        }

        .option-btn.selected {
            background: #e0e7ff;
            border-color: #1d3461;
            font-weight: bold;
        }

        /* 3. Footer (Action Buttons) - Fixed at bottom */
        footer {
            flex-shrink: 0;
            background: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #e2e8f0;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
        }

        .action-btn {
            flex: 1;
            padding: 12px;
            margin: 0 5px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-prev { background: #64748b; }
        .btn-next { background: #1d3461; }
        .btn-submit { background: #d4a017; color: #1d3461; display: none; }

        /* Full Screen Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: white;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .start-btn {
            background: #1d3461;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 30px;
            border: none;
            margin-top: 20px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(29, 52, 97, 0.3);
        }

        /* Hidden Class */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="loading-screen" class="overlay">
        <h2 style="color: #1d3461;">તમારો ટેસ્ટ તૈયાર થઈ રહ્યો છે...</h2>
        <p style="color: #64748b;">કૃપા કરીને થોડી રાહ જુઓ ⏳</p>
    </div>

    <div id="start-screen" class="overlay hidden">
        <h2>અધ્યાપક સાથી - મોક ટેસ્ટ</h2>
        <p id="subject-name" style="color: #d4a017; font-weight: bold; font-size: 1.2rem;"></p>
        <p>• કુલ પ્રશ્નો: <span id="total-q-count">0</span></p>
        <p>• દરેક પ્રશ્ન ધ્યાનથી વાંચીને જવાબ સિલેક્ટ કરો.</p>
        <button class="start-btn" onclick="startTest()">ટેસ્ટ શરૂ કરો 🚀</button>
    </div>

    <div id="test-app" class="app-container hidden">
        
        <header>
            <div id="q-number">પ્રશ્ન 1 / 10</div>
            <div class="timer" id="timer">15:00</div>
        </header>

        <main>
            <div class="question-box" id="question-text">પ્રશ્ન લોડ થઈ રહ્યો છે...</div>
            <div class="options-grid" id="options-container">
                </div>
        </main>

        <footer>
            <button class="action-btn btn-prev" id="prev-btn" onclick="prevQuestion()">પાછળ</button>
            <button class="action-btn btn-next" id="next-btn" onclick="nextQuestion()">આગળ</button>
            <button class="action-btn btn-submit" id="submit-btn" onclick="submitTest()">સબમિટ કરો</button>
        </footer>

    </div>

    <script>
        // Your Google Apps Script Web App URL
        const SCRIPT_URL = "તમારી_WEB_APP_URL_અહીં_નાખો"; 
        
        let questions = [];
        let currentQIndex = 0;
        let userAnswers = {};
        
        // 1. Get Subject from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const subject = urlParams.get('subject') || 'gujarati'; // default

        // Map English codes to Gujarati display names
        const subjectMap = {
            'gujarati': 'ગુજરાતી વ્યાકરણ',
            'english': 'English Grammar',
            'psych': 'શૈક્ષણિક મનોવિજ્ઞાન',
            'reasoning': 'તાર્કિક ક્ષમતા',
            'eval': 'વર્ગવ્યવહાર અને મૂલ્યાંકન',
            'gk': 'સામાન્ય જ્ઞાન',
            'philosophy': 'ફિલસૂફી' // <-- PHILOSOPHY ADDED HERE
        };

        // 2. Fetch Data from Backend
        window.onload = function() {
            document.getElementById('subject-name').innerText = subjectMap[subject] || 'મોક ટેસ્ટ';
            
            // Call Google Apps Script
            fetch(`${SCRIPT_URL}?subject=${subject}`)
                .then(response => response.json())
                .then(data => {
                    if(data && data.length > 0) {
                        questions = data;
                        document.getElementById('total-q-count').innerText = questions.length;
                        // Hide loading, show START screen
                        document.getElementById('loading-screen').classList.add('hidden');
                        document.getElementById('start-screen').classList.remove('hidden');
                    } else {
                        document.getElementById('loading-screen').innerHTML = "<h3>આ વિષયના પ્રશ્નો હાલ ઉપલબ્ધ નથી.</h3><button onclick='window.history.back()'>પાછા જાવ</button>";
                    }
                })
                .catch(error => {
                    document.getElementById('loading-screen').innerHTML = "<h3>ઈન્ટરનેટ કનેક્શનમાં સમસ્યા છે. પેજ રિફ્રેશ કરો.</h3>";
                });
        };

        // 3. Start Test Logic
        function startTest() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('test-app').classList.remove('hidden');
            loadQuestion(0);
            startTimer(15 * 60); // 15 Minutes Example
        }

        // 4. Load Question UI
        function loadQuestion(index) {
            const q = questions[index];
            document.getElementById('q-number').innerText = `પ્રશ્ન ${index + 1} / ${questions.length}`;
            document.getElementById('question-text').innerHTML = q.Question;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = ''; // Clear old

            const options = [q.OptA, q.OptB, q.OptC, q.OptD];
            options.forEach((optText, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                if (userAnswers[index] === i) btn.classList.add('selected'); // Retain previous selection
                
                btn.innerText = `${String.fromCharCode(65 + i)}) ${optText}`;
                btn.onclick = () => selectOption(index, i, btn);
                optsContainer.appendChild(btn);
            });

            // Button visibility
            document.getElementById('prev-btn').style.visibility = index === 0 ? 'hidden' : 'visible';
            
            if (index === questions.length - 1) {
                document.getElementById('next-btn').style.display = 'none';
                document.getElementById('submit-btn').style.display = 'block';
            } else {
                document.getElementById('next-btn').style.display = 'block';
                document.getElementById('submit-btn').style.display = 'none';
            }
        }

        function selectOption(qIndex, optIndex, btnElement) {
            userAnswers[qIndex] = optIndex;
            // Remove 'selected' from all siblings
            const siblings = btnElement.parentElement.children;
            for(let btn of siblings) btn.classList.remove('selected');
            // Add to clicked
            btnElement.classList.add('selected');
        }

        function nextQuestion() {
            if (currentQIndex < questions.length - 1) {
                currentQIndex++;
                loadQuestion(currentQIndex);
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                loadQuestion(currentQIndex);
            }
        }

        function submitTest() {
            // Here you can redirect to result page or calculate score
            alert("ટેસ્ટ સફળતાપૂર્વક સબમિટ થઈ ગયો છે!");
            // window.location.href = "result.html"; // Redirect to your dashboard/result
        }

        // Timer Logic
        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                document.getElementById('timer').textContent = minutes + ":" + seconds;
                if (--timer < 0) {
                    submitTest(); // Auto submit when time is up
                }
            }, 1000);
        }
    </script>
</body>
</html>
